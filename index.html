<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var s = localStorage.getItem("aidiff-color-scheme");
          var dark = s === "dark" ? true : s === "light" ? false : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-color-scheme", dark ? "dark" : "light");
        } catch (e) {
          document.documentElement.setAttribute("data-color-scheme", "light");
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aidiff</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
